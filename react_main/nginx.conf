map $http_upgrade $connection_upgrade {  
    default upgrade;
    ''      close;
}

server {
	server_name passionmafia.io;
    root /usr/share/nginx/html;
    index index.html index.htm index.nginx-debian.html;

	location / {
        try_files $uri $uri/ /index.html;
	}
	
	location /uploads/ {
		alias /uploads/;
		#expires 3d;
		#add_header Cache-Control "public, 259200, immutable";
	}
	
	location /uploads/decks/ {
		alias /uploads/decks/;
	}

	location /chatSocket {
		proxy_pass http://127.0.0.1:2999;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
	}

	location /3010 {
	    proxy_pass http://127.0.0.1:3010/;
        proxy_http_version 1.1;
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection $connection_upgrade;
	    proxy_set_header Host $host;
    }
    
    location /api {
        #STAYS HTTP, NOT HTTPS
        proxy_pass              http://127.0.0.1:3000;
        proxy_pass_request_body on;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Original-URI    $request_uri;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    }
    
    location /auth/discord {
        proxy_pass http://127.0.0.1:3000/api/auth/discord;
		proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
		add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    }

	location ~* \.(jpg|jpeg|png|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

	location ~* \.(mp3|aac|ogg|wav|flac)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
	
    listen 443 ssl http2;
    
    ssl_certificate /etc/letsencrypt/live/passionmafia.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/passionmafia.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
	listen 80;
	server_name passionmafia.io;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
